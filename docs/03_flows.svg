<svg viewBox="0 0 1180 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { fill:#0F172A; font-size:23px; font-weight:800; }
      .sub { fill:#5b6472; font-size:12.5px; }
      .h { fill:#0F766E; font-size:15px; font-weight:700; }
      .step { fill:#ffffff; stroke:#0F172A; stroke-width:1.1; }
      .stept { fill:#0F172A; font-size:12px; }
      .steps { fill:#5b6472; font-size:10.5px; }
      .gate { fill:#FEF3C7; stroke:#EAB308; stroke-width:1.4; }
      .db { fill:#E7F5F3; stroke:#0F766E; stroke-width:1.3; }
      .ext { fill:#F1E9FB; stroke:#7c3aed; stroke-width:1.3; }
      .flow { stroke:#0F766E; stroke-width:1.7; fill:none; marker-end:url(#a2); }
      .flowb { stroke:#c2410c; stroke-width:1.7; fill:none; marker-end:url(#a3); stroke-dasharray:5 3; }
      .lbl { fill:#0F766E; font-size:10px; }
      .lblb { fill:#c2410c; font-size:10px; font-style:italic; }
      .note { fill:#8a6d0b; font-size:10.5px; font-style:italic; }
      .band { fill:#F8F4EF; stroke:#0F766E; stroke-width:1.3; }
    </style>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0F766E"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <text x="40" y="40" class="title">Angaza360 — Key Flows</text>
  <text x="40" y="62" class="sub">A: how any authenticated request reaches the right tenant's data · B: how an external payment/tax integration works per-tenant, idempotently</text>

  <!-- FLOW A -->
  <rect x="30" y="82" width="1120" height="300" class="band" rx="10"/>
  <text x="48" y="106" class="h">A · AUTHENTICATED REQUEST LIFECYCLE  (POS sale as the example)</text>

  <rect x="50" y="122" width="140" height="60" class="step" rx="6"/><text x="120" y="147" class="stept" text-anchor="middle">Cashier device</text><text x="120" y="165" class="steps" text-anchor="middle">Bearer JWT</text>
  <rect x="230" y="122" width="150" height="60" class="gate" rx="6"/><text x="305" y="143" class="stept" text-anchor="middle">Edge: CORS,</text><text x="305" y="159" class="stept" text-anchor="middle">rate-limit</text>
  <rect x="420" y="122" width="160" height="60" class="gate" rx="6"/><text x="500" y="143" class="stept" text-anchor="middle">requireAuth</text><text x="500" y="159" class="steps" text-anchor="middle">verify JWT + session live</text>
  <rect x="620" y="122" width="170" height="60" class="gate" rx="6"/><text x="705" y="143" class="stept" text-anchor="middle">Tenant context</text><text x="705" y="159" class="steps" text-anchor="middle">tid → resolve schema</text>
  <rect x="830" y="122" width="150" height="60" class="gate" rx="6"/><text x="905" y="143" class="stept" text-anchor="middle">requireRole</text><text x="905" y="159" class="steps" text-anchor="middle">CASHIER ✓</text>

  <path class="flow" d="M190 152 L230 152"/>
  <path class="flow" d="M380 152 L420 152"/>
  <path class="flow" d="M580 152 L620 152"/>
  <path class="flow" d="M790 152 L830 152"/>
  <path class="flow" d="M905 182 L905 210"/>

  <rect x="330" y="212" width="220" height="58" class="step" rx="6"/><text x="440" y="235" class="stept" text-anchor="middle">Sales service — ONE db.$transaction</text><text x="440" y="253" class="steps" text-anchor="middle">orchestrates inventory + ledger</text>
  <rect x="600" y="212" width="180" height="58" class="step" rx="6"/><text x="690" y="235" class="stept" text-anchor="middle">Inventory service</text><text x="690" y="253" class="steps" text-anchor="middle">stock ↓ · COGS post</text>
  <rect x="820" y="212" width="160" height="58" class="step" rx="6"/><text x="900" y="235" class="stept" text-anchor="middle">Ledger service</text><text x="900" y="253" class="steps" text-anchor="middle">revenue + VAT post</text>

  <path class="flow" d="M905 212 L905 190" />
  <path class="flow" d="M760 240 L600 240"/>
  <path class="flow" d="M820 240 L790 240" transform="translate(0,0)"/>
  <line class="flow" x1="440" y1="270" x2="440" y2="300"/>

  <rect x="330" y="300" width="500" height="56" class="db" rx="6"/><text x="580" y="322" class="stept" text-anchor="middle" font-weight="700">tenant_&lt;slug&gt; schema — atomic commit</text>
  <text x="580" y="342" class="steps" text-anchor="middle">stock_movements + journal_entries/lines + sale/lines/tenders all commit together, or none do</text>

  <text x="50" y="336" class="note" width="260">Tenant schema is derived from the</text>
  <text x="50" y="352" class="note">session's tid claim, resolved against</text>
  <text x="50" y="368" class="note">public.tenants — NEVER from the</text>
  <text x="50" y="384" class="note" fill="#c2410c">request body, host, or a header.</text>

  <!-- FLOW B -->
  <rect x="30" y="400" width="1120" height="600" class="band" rx="10"/>
  <text x="48" y="424" class="h">B · PER-TENANT EXTERNAL INTEGRATION  (M-Pesa STK shown; eTIMS OSCU is the identical shape)</text>

  <!-- outbound -->
  <text x="48" y="452" class="stept" font-weight="700" fill="#0F766E">OUTBOUND — cashier triggers payment / signing</text>

  <rect x="50" y="464" width="150" height="60" class="step" rx="6"/><text x="125" y="488" class="stept" text-anchor="middle">POST stk-push</text><text x="125" y="506" class="steps" text-anchor="middle">(authenticated)</text>
  <rect x="240" y="464" width="180" height="60" class="step" rx="6"/><text x="330" y="485" class="stept" text-anchor="middle">Payment service</text><text x="330" y="503" class="steps" text-anchor="middle">resolve tenant + tender</text>
  <rect x="460" y="464" width="200" height="60" class="db" rx="6"/><text x="560" y="485" class="stept" text-anchor="middle" font-weight="700">Credential store (this tenant)</text><text x="560" y="503" class="steps" text-anchor="middle">decrypt (MPESA, active env)</text>
  <rect x="700" y="464" width="180" height="60" class="step" rx="6"/><text x="790" y="485" class="stept" text-anchor="middle">Provider factory</text><text x="790" y="503" class="steps" text-anchor="middle">Simulated | RealDaraja</text>
  <rect x="920" y="464" width="180" height="60" class="ext" rx="6"/><text x="1010" y="485" class="stept" text-anchor="middle">Safaricom Daraja</text><text x="1010" y="503" class="steps" text-anchor="middle">STK to customer phone</text>

  <path class="flow" d="M200 494 L240 494"/>
  <path class="flow" d="M420 494 L460 494"/>
  <path class="flow" d="M660 494 L700 494"/>
  <path class="flow" d="M880 494 L920 494"/>

  <rect x="240" y="544" width="180" height="46" class="db" rx="6"/><text x="330" y="572" class="stept" text-anchor="middle">MpesaTransaction = INITIATED</text>
  <path class="flow" d="M330 524 L330 544"/>
  <text x="440" y="572" class="note">1015 M-Pesa Clearing already debited at sale time — money is promised, not yet received</text>

  <!-- inbound -->
  <text x="48" y="626" class="stept" font-weight="700" fill="#c2410c">INBOUND — the public webhook (the ONLY unauthenticated write path)</text>

  <rect x="50" y="640" width="180" height="66" class="ext" rx="6"/><text x="140" y="662" class="stept" text-anchor="middle">Safaricom POSTs</text><text x="140" y="680" class="steps" text-anchor="middle">callback JSON</text><text x="140" y="696" class="steps" text-anchor="middle">(retries on non-200)</text>
  <rect x="270" y="640" width="200" height="66" class="gate" rx="6"/><text x="370" y="660" class="stept" text-anchor="middle">/webhooks/mpesa/</text><text x="370" y="676" class="stept" text-anchor="middle">:secret/:tenantSlug</text><text x="370" y="694" class="steps" text-anchor="middle">wrong secret → 404</text>
  <rect x="510" y="640" width="190" height="66" class="step" rx="6"/><text x="605" y="660" class="stept" text-anchor="middle">Tenant from PATH</text><text x="605" y="678" class="steps" text-anchor="middle">(server-generated URL,</text><text x="605" y="694" class="steps" text-anchor="middle">never the body)</text>
  <rect x="740" y="640" width="200" height="66" class="gate" rx="6"/><text x="840" y="660" class="stept" text-anchor="middle">Idempotency guard</text><text x="840" y="678" class="steps" text-anchor="middle">terminal state? → 200 no-op</text><text x="840" y="694" class="steps" text-anchor="middle">(DB backstops it)</text>

  <path class="flowb" d="M1010 524 L1010 610 L140 610 L140 640"/>
  <text x="520" y="604" class="lblb">Safaricom → your public HTTPS endpoint (seconds to minutes later)</text>
  <path class="flow" d="M230 673 L270 673"/>
  <path class="flow" d="M470 673 L510 673"/>
  <path class="flow" d="M700 673 L740 673"/>
  <path class="flow" d="M840 706 L840 730"/>

  <rect x="600" y="730" width="480" height="70" class="db" rx="6"/><text x="840" y="752" class="stept" text-anchor="middle" font-weight="700">ONE db.$transaction (success, ResultCode 0):</text>
  <text x="840" y="772" class="steps" text-anchor="middle">Dr 1010 M-Pesa Till / Cr 1015 Clearing · tender → CONFIRMED · txn → CALLBACK_OK</text>
  <text x="840" y="788" class="steps" text-anchor="middle">1015 nets to zero for the sale · trial balance stays balanced</text>

  <rect x="120" y="730" width="440" height="70" class="db" rx="6"/><text x="340" y="752" class="stept" text-anchor="middle" font-weight="700">failure / timeout branch:</text>
  <text x="340" y="772" class="steps" text-anchor="middle">Cr 1015 / Dr 1100 AR (shop is owed it) · tender → FAILED</text>
  <text x="340" y="788" class="steps" text-anchor="middle">sale paymentStatus downgraded · nightly txn-status sweep catches lost callbacks</text>

  <path class="flow" d="M800 730 L840 712"/>
  <path class="flow" d="M420 730 L420 712 L560 712" transform="translate(-60,0)"/>

  <!-- go-live band -->
  <rect x="50" y="822" width="1050" height="66" fill="#ffffff" stroke="#0F766E" stroke-width="1.5" rx="8"/>
  <text x="70" y="846" class="stept" font-weight="700" fill="#0F766E">CONFIG-ONLY GO-LIVE</text>
  <text x="70" y="866" class="steps" font-size="11">Sandbox → production is one credential row activated + MPESA_ENVIRONMENT flipped for that tenant. The webhook, idempotency guard, ledger posting, and interface do not change.</text>
  <text x="70" y="881" class="steps" font-size="11">eTIMS follows the exact same picture: opt-in per sale → OSCU signing via the tenant's own KRA credential from the store → EtimsInvoice number + QR onto the receipt, under the tenant's PIN.</text>

  <text x="50" y="924" class="note">Why this matters for real businesses: every scale-up in this diagram is additive — a new provider row, a new environment value, a new opt-in flag. None of it is an ALTER across a live tenant's</text>
  <text x="50" y="942" class="note">financial history. A shop already trading sees "connect M-Pesa", "go live", "enable eTIMS" as buttons that appear — never "we need to migrate your data".</text>
  <text x="50" y="972" class="sub" font-weight="700">The MVP builds the entire skeleton in this picture. Deferred modules add flesh to bones that already exist.</text>
</svg>
