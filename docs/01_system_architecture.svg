<svg viewBox="0 0 1180 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .layer { fill:#F8F4EF; stroke:#0F766E; stroke-width:1.5; rx:10; }
      .layerlabel { fill:#0F766E; font-size:15px; font-weight:700; letter-spacing:.4px; }
      .box { fill:#ffffff; stroke:#0F172A; stroke-width:1; rx:6; }
      .boxt { fill:#0F172A; font-size:12.5px; }
      .boxs { fill:#5b6472; font-size:10.5px; }
      .mvp { fill:#0F766E; }
      .def { fill:#EAB308; }
      .badge { font-size:9px; font-weight:700; fill:#ffffff; }
      .title { fill:#0F172A; font-size:24px; font-weight:800; }
      .sub { fill:#5b6472; font-size:13px; }
      .flow { stroke:#0F766E; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .note { fill:#8a6d0b; font-size:10.5px; font-style:italic; }
      .legendt { fill:#0F172A; font-size:11.5px; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0F766E"/>
    </marker>
  </defs>

  <text x="40" y="44" class="title">Angaza360 — System Architecture (end-to-end vision)</text>
  <text x="40" y="66" class="sub">Green = built or in MVP scope · Gold = deferred, foundation plug already present · Flows show the request path</text>

  <!-- Legend -->
  <rect x="820" y="30" width="14" height="14" rx="3" class="mvp"/>
  <text x="840" y="41" class="legendt">In MVP / built</text>
  <rect x="820" y="52" width="14" height="14" rx="3" class="def"/>
  <text x="840" y="63" class="legendt">Deferred (plug ready)</text>

  <!-- LAYER 1: Clients -->
  <rect x="40" y="90" width="1100" height="96" class="layer" rx="10"/>
  <text x="54" y="112" class="layerlabel">1 · CLIENT INTERFACES</text>
  <g>
    <rect x="60" y="124" width="150" height="50" class="box" rx="6"/><text x="70" y="144" class="boxt">MSME Web Portal</text><text x="70" y="160" class="boxs">Next.js 14 PWA</text>
    <rect x="60" y="124" width="46" height="15" rx="3" class="def"/><text x="66" y="135" class="badge">MVP-thin</text>
    <rect x="222" y="124" width="150" height="50" class="box" rx="6"/><text x="232" y="144" class="boxt">POS Terminal</text><text x="232" y="160" class="boxs">offline-capable PWA</text>
    <rect x="222" y="124" width="30" height="15" rx="3" class="def"/><text x="228" y="135" class="badge">MVP</text>
    <rect x="384" y="124" width="150" height="50" class="box" rx="6"/><text x="394" y="144" class="boxt">Storefront (B2C)</text><text x="394" y="160" class="boxs">per-tenant SSR</text>
    <rect x="384" y="124" width="30" height="15" rx="3" class="def"/><text x="390" y="135" class="badge">DEF</text>
    <rect x="546" y="124" width="150" height="50" class="box" rx="6"/><text x="556" y="144" class="boxt">B2B Marketplace</text><text x="556" y="160" class="boxs">inter-MSME trade</text>
    <rect x="546" y="124" width="30" height="15" rx="3" class="def"/><text x="552" y="135" class="badge">DEF</text>
    <rect x="708" y="124" width="150" height="50" class="box" rx="6"/><text x="718" y="144" class="boxt">Command Center</text><text x="718" y="160" class="boxs">Angaza super-admin</text>
    <rect x="708" y="124" width="30" height="15" rx="3" class="def"/><text x="714" y="135" class="badge">DEF</text>
    <rect x="870" y="124" width="150" height="50" class="box" rx="6"/><text x="880" y="144" class="boxt">Donor Dashboard</text><text x="880" y="160" class="boxs">read-only impact</text>
    <rect x="870" y="124" width="30" height="15" rx="3" class="def"/><text x="876" y="135" class="badge">DEF</text>
    <rect x="1032" y="124" width="90" height="50" class="box" rx="6"/><text x="1042" y="144" class="boxt">Mobile</text><text x="1042" y="160" class="boxs">RN app</text>
    <rect x="1032" y="124" width="30" height="15" rx="3" class="def"/><text x="1038" y="135" class="badge">DEF</text>
  </g>

  <path class="flow" d="M590 186 L590 208"/>

  <!-- LAYER 2: Gateway / Auth -->
  <rect x="40" y="212" width="1100" height="92" class="layer" rx="10"/>
  <text x="54" y="234" class="layerlabel">2 · API GATEWAY, TENANT CONTEXT &amp; AUTH  (RBAC is the single gate)</text>
  <g>
    <rect x="60" y="246" width="230" height="48" class="box" rx="6"/><text x="70" y="266" class="boxt">Fastify edge · CORS · rate-limit</text><text x="70" y="281" class="boxs">Kong in production</text>
    <rect x="302" y="246" width="250" height="48" class="box" rx="6"/><text x="312" y="266" class="boxt">Session JWT + refresh rotation</text><text x="312" y="281" class="boxs">Firebase-capable · scrypt passwords</text>
    <rect x="302" y="246" width="30" height="15" rx="3" class="mvp"/><text x="308" y="257" class="badge">MVP</text>
    <rect x="564" y="246" width="270" height="48" class="box" rx="6"/><text x="574" y="266" class="boxt">Tenant-context middleware</text><text x="574" y="281" class="boxs">schema resolved from session, never request body</text>
    <rect x="564" y="246" width="30" height="15" rx="3" class="mvp"/><text x="570" y="257" class="badge">MVP</text>
    <rect x="846" y="246" width="274" height="48" class="box" rx="6"/><text x="856" y="266" class="boxt">RBAC guards · 9 roles</text><text x="856" y="281" class="boxs">requireAuth / requireRole / requireTenant</text>
    <rect x="846" y="246" width="30" height="15" rx="3" class="mvp"/><text x="852" y="257" class="badge">MVP</text>
  </g>

  <path class="flow" d="M590 304 L590 326"/>

  <!-- LAYER 3: Domain services -->
  <rect x="40" y="330" width="1100" height="250" class="layer" rx="10"/>
  <text x="54" y="352" class="layerlabel">3 · DOMAIN SERVICES  (modular monolith now → extractable microservices later; same boundaries)</text>

  <!-- financial core row -->
  <g>
    <rect x="60" y="364" width="150" height="52" class="box" rx="6"/><text x="70" y="384" class="boxt">Ledger Engine</text><text x="70" y="400" class="boxs">sole journal writer</text>
    <rect x="60" y="364" width="30" height="15" rx="3" class="mvp"/><text x="66" y="375" class="badge">MVP</text>
    <rect x="222" y="364" width="150" height="52" class="box" rx="6"/><text x="232" y="384" class="boxt">Inventory Engine</text><text x="232" y="400" class="boxs">sole stock writer · WAC</text>
    <rect x="222" y="364" width="30" height="15" rx="3" class="mvp"/><text x="228" y="375" class="badge">MVP</text>
    <rect x="384" y="364" width="150" height="52" class="box" rx="6"/><text x="394" y="384" class="boxt">POS / Sales</text><text x="394" y="400" class="boxs">atomic sale txn</text>
    <rect x="384" y="364" width="30" height="15" rx="3" class="mvp"/><text x="390" y="375" class="badge">MVP</text>
    <rect x="546" y="364" width="150" height="52" class="box" rx="6"/><text x="556" y="384" class="boxt">Provisioning</text><text x="556" y="400" class="boxs">idempotent, per-schema</text>
    <rect x="546" y="364" width="30" height="15" rx="3" class="mvp"/><text x="552" y="375" class="badge">MVP</text>
    <rect x="708" y="364" width="180" height="52" class="box" rx="6"/><text x="718" y="384" class="boxt">Integration Credential Store</text><text x="718" y="400" class="boxs">per-tenant, encrypted (Task 3.4)</text>
    <rect x="708" y="364" width="30" height="15" rx="3" class="mvp"/><text x="714" y="375" class="badge">NEXT</text>
    <rect x="900" y="364" width="220" height="52" class="box" rx="6"/><text x="910" y="384" class="boxt">Provider layer (interface + factory)</text><text x="910" y="400" class="boxs">M-Pesa · eTIMS · Stripe · SMS — config-swap</text>
    <rect x="900" y="364" width="30" height="15" rx="3" class="mvp"/><text x="906" y="375" class="badge">MVP</text>
  </g>
  <!-- compliance / payroll row -->
  <g>
    <rect x="60" y="426" width="150" height="52" class="box" rx="6"/><text x="70" y="446" class="boxt">M-Pesa Payments</text><text x="70" y="462" class="boxs">STK · idempotent callback</text>
    <rect x="60" y="426" width="30" height="15" rx="3" class="mvp"/><text x="66" y="437" class="badge">MVP</text>
    <rect x="222" y="426" width="150" height="52" class="box" rx="6"/><text x="232" y="446" class="boxt">eTIMS Signing</text><text x="232" y="462" class="boxs">OSCU · opt-in per sale</text>
    <rect x="222" y="426" width="30" height="15" rx="3" class="def"/><text x="228" y="437" class="badge">4.1</text>
    <rect x="384" y="426" width="150" height="52" class="box" rx="6"/><text x="394" y="446" class="boxt">Procurement / AP</text><text x="394" y="462" class="boxs">PO · goods receipt</text>
    <rect x="384" y="426" width="30" height="15" rx="3" class="def"/><text x="390" y="437" class="badge">DEF</text>
    <rect x="546" y="426" width="150" height="52" class="box" rx="6"/><text x="556" y="446" class="boxt">AR / Credit</text><text x="556" y="462" class="boxs">aging · statements</text>
    <rect x="546" y="426" width="30" height="15" rx="3" class="def"/><text x="552" y="437" class="badge">part</text>
    <rect x="708" y="426" width="150" height="52" class="box" rx="6"/><text x="718" y="446" class="boxt">Payroll / HR</text><text x="718" y="462" class="boxs">PAYE·NSSF·SHA·Levy</text>
    <rect x="708" y="426" width="30" height="15" rx="3" class="def"/><text x="714" y="437" class="badge">DEF</text>
    <rect x="870" y="426" width="150" height="52" class="box" rx="6"/><text x="880" y="446" class="boxt">Statutory Config</text><text x="880" y="462" class="boxs">effective-dated rates</text>
    <rect x="870" y="426" width="30" height="15" rx="3" class="def"/><text x="876" y="437" class="badge">DEF</text>
  </g>
  <!-- growth row -->
  <g>
    <rect x="60" y="488" width="150" height="52" class="box" rx="6"/><text x="70" y="508" class="boxt">CRM / Loyalty</text><text x="70" y="524" class="boxs">customers · RFM</text>
    <rect x="60" y="488" width="30" height="15" rx="3" class="def"/><text x="66" y="499" class="badge">part</text>
    <rect x="222" y="488" width="150" height="52" class="box" rx="6"/><text x="232" y="508" class="boxt">E-Commerce</text><text x="232" y="524" class="boxs">storefront · orders</text>
    <rect x="222" y="488" width="30" height="15" rx="3" class="def"/><text x="228" y="499" class="badge">DEF</text>
    <rect x="384" y="488" width="150" height="52" class="box" rx="6"/><text x="394" y="508" class="boxt">B2B Marketplace</text><text x="394" y="524" class="boxs">RFQ · escrow</text>
    <rect x="384" y="488" width="30" height="15" rx="3" class="def"/><text x="390" y="499" class="badge">DEF</text>
    <rect x="546" y="488" width="150" height="52" class="box" rx="6"/><text x="556" y="508" class="boxt">Trust Score</text><text x="556" y="524" class="boxs">badges · peer reviews</text>
    <rect x="546" y="488" width="30" height="15" rx="3" class="def"/><text x="552" y="499" class="badge">DEF</text>
    <rect x="708" y="488" width="150" height="52" class="box" rx="6"/><text x="718" y="508" class="boxt">Reporting / IFRS</text><text x="718" y="524" class="boxs">P&amp;L · BS · Cash Flow</text>
    <rect x="708" y="488" width="30" height="15" rx="3" class="def"/><text x="714" y="499" class="badge">DEF</text>
    <rect x="870" y="488" width="150" height="52" class="box" rx="6"/><text x="880" y="508" class="boxt">Notifications</text><text x="880" y="524" class="boxs">SMS · email · push</text>
    <rect x="870" y="488" width="30" height="15" rx="3" class="def"/><text x="876" y="499" class="badge">DEF</text>
  </g>
  <text x="60" y="562" class="note">Every service that moves value posts through the Ledger Engine; every external call goes through the Provider layer + Credential Store. These two rules never bend.</text>

  <path class="flow" d="M300 580 L300 620"/>
  <path class="flow" d="M880 580 L880 620"/>

  <!-- LAYER 4: Data + async + AI -->
  <rect x="40" y="624" width="540" height="286" class="layer" rx="10"/>
  <text x="54" y="646" class="layerlabel">4 · DATA LAYER</text>
  <g>
    <rect x="60" y="658" width="230" height="52" class="box" rx="6"/><text x="70" y="678" class="boxt">PostgreSQL — schema-per-tenant</text><text x="70" y="694" class="boxs">public registry + tenant_&lt;slug&gt; schemas</text>
    <rect x="60" y="658" width="30" height="15" rx="3" class="mvp"/><text x="66" y="669" class="badge">MVP</text>
    <rect x="302" y="658" width="258" height="52" class="box" rx="6"/><text x="312" y="678" class="boxt">Dual Prisma clients (platform / tenant)</text><text x="312" y="694" class="boxs">pg adapter · per-tenant schema qualification</text>
    <rect x="302" y="658" width="30" height="15" rx="3" class="mvp"/><text x="308" y="669" class="badge">MVP</text>
    <rect x="60" y="720" width="230" height="48" class="box" rx="6"/><text x="70" y="740" class="boxt">Redis — cache / sessions / queues</text><text x="70" y="755" class="boxs">Memorystore</text>
    <rect x="60" y="720" width="30" height="15" rx="3" class="def"/><text x="66" y="731" class="badge">DEF</text>
    <rect x="302" y="720" width="258" height="48" class="box" rx="6"/><text x="312" y="740" class="boxt">Cloud Storage — receipts, docs, media</text><text x="312" y="755" class="boxs">GCS</text>
    <rect x="302" y="720" width="30" height="15" rx="3" class="def"/><text x="308" y="731" class="badge">DEF</text>
    <rect x="60" y="778" width="500" height="48" class="box" rx="6"/><text x="70" y="798" class="boxt">Encryption at rest — app-level AES-256-GCM now → Cloud KMS later</text><text x="70" y="813" class="boxs">credential blobs stored as ciphertext + key reference</text>
    <rect x="60" y="778" width="30" height="15" rx="3" class="mvp"/><text x="66" y="789" class="badge">3.4</text>
  </g>
  <text x="60" y="852" class="note">Isolation is structural (separate schema), never a tenant_id column.</text>
  <text x="60" y="872" class="note">Deferred rows use the NULL-means-default plug so scale-up needs no</text>
  <text x="60" y="890" class="note">backfill across live financial data.</text>

  <rect x="600" y="624" width="540" height="286" class="layer" rx="10"/>
  <text x="614" y="646" class="layerlabel">5 · ASYNC PIPELINE &amp; AI / ANALYTICS</text>
  <g>
    <rect x="620" y="658" width="240" height="52" class="box" rx="6"/><text x="630" y="678" class="boxt">Event bus (Pub/Sub) + workers</text><text x="630" y="694" class="boxs">BullMQ now · Pub/Sub + Dataflow later</text>
    <rect x="620" y="658" width="30" height="15" rx="3" class="def"/><text x="626" y="669" class="badge">DEF</text>
    <rect x="872" y="658" width="248" height="52" class="box" rx="6"/><text x="882" y="678" class="boxt">Nightly reconcilers</text><text x="882" y="694" class="boxs">M-Pesa txn-status sweep · period close</text>
    <rect x="872" y="658" width="30" height="15" rx="3" class="def"/><text x="878" y="669" class="badge">seam</text>
    <rect x="620" y="720" width="240" height="52" class="box" rx="6"/><text x="630" y="740" class="boxt">Analytics warehouse (BigQuery)</text><text x="630" y="756" class="boxs">aggregated / anonymized cross-tenant</text>
    <rect x="620" y="720" width="30" height="15" rx="3" class="def"/><text x="626" y="731" class="badge">DEF</text>
    <rect x="872" y="720" width="248" height="52" class="box" rx="6"/><text x="882" y="740" class="boxt">MSME-level AI Coach (RAG)</text><text x="882" y="756" class="boxs">Gemini · scoped to req.tenantDb only</text>
    <rect x="872" y="720" width="30" height="15" rx="3" class="def"/><text x="878" y="731" class="badge">DEF</text>
    <rect x="620" y="782" width="240" height="52" class="box" rx="6"/><text x="630" y="802" class="boxt">Angaza-level AI</text><text x="630" y="818" class="boxs">cohort · failure-risk · donor impact</text>
    <rect x="620" y="782" width="30" height="15" rx="3" class="def"/><text x="626" y="793" class="badge">DEF</text>
    <rect x="872" y="782" width="248" height="52" class="box" rx="6"/><text x="882" y="802" class="boxt">Predictive models</text><text x="882" y="818" class="boxs">demand · churn · Trust Score engine</text>
    <rect x="872" y="782" width="30" height="15" rx="3" class="def"/><text x="878" y="793" class="badge">DEF</text>
  </g>
  <text x="620" y="872" class="note">AI reads the same isolated tenant data through the same</text>
  <text x="620" y="890" class="note">RBAC + tenant-context gate — no cross-tenant leakage, ever.</text>

  <!-- external -->
  <path class="flow" d="M985 416 L985 452 L1060 452 L1060 92" transform="translate(60,0)" stroke-dasharray="4 3"/>
</svg>
